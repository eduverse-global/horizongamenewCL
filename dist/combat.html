<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102e35"><title>NARAI: Winds of Siam</title><link rel="stylesheet" href="/narai/style.css"><meta name="description" content="A bilingual English and Thai tactical sailing prototype set against a fictional Narai-era Siam adventure."></head><body>
<header><div class="brand"><strong>NARAI</strong><span data-t="subtitle"></span></div><div class="mission"><small data-t="prototype"></small><h1 data-t="mission"></h1></div><div class="top-actions"><button id="briefing" data-t="briefing"></button><label><span class="sr-only" data-t="language"></span><select id="language"><option value="en">EN · English</option><option value="th">TH · ไทย</option></select></label></div></header>
<main><section class="playfield"><div class="objective"><span data-t="objective"></span><b id="round"></b></div><div id="stage" tabindex="0"><div class="exit" data-t="exit"></div><div id="ship-labels"></div><div id="webgl-error" hidden></div></div><div class="sea-status"><span data-t="current"></span><span id="stores"></span></div></section>
<aside aria-label="Battle orders"><div class="panel-top"><small data-t="planning"></small><button id="inspect" data-t="inspect"></button></div><section class="crew"><h2 data-t="crew"></h2><div id="crew"></div><p id="unassigned"></p></section><section class="orders"><h2 id="order-count"></h2><div class="action-grid" id="actions"></div><div id="options"></div><p id="hint"></p><ol id="plan"></ol><button id="undo" data-t="undo"></button></section><details id="forecast"><summary data-t="forecast"></summary><p id="health-forecast"></p><ul id="forecast-events"></ul></details><label class="preview"><input id="preview" type="checkbox" checked><span data-t="preview"></span></label><button id="commit" class="primary" data-t="commit"></button><p id="save-status"></p></aside></main>
<footer><span data-t="working"></span><a href="/" data-t="legacy"></a><button id="restart" data-t="retry"></button></footer><div id="toast" role="status" aria-live="polite"></div><dialog id="dialog"><button id="close-dialog" class="close" aria-label="Close">×</button><div id="dialog-content"></div></dialog><script type="module" src="/narai/app.js"></script></body></html>
